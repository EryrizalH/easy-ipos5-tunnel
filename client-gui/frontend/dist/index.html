<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NusaTunnel</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <h1>NusaTunnel</h1>
        <small id="lastChecked">Terakhir diperiksa: -</small>
      </header>

      <section class="status-grid">
        <article class="tile">
          <span class="label">Sambungan</span>
          <p id="connectionState" class="value">-</p>
        </article>
        <article class="tile">
          <span class="label">Layanan</span>
          <p id="serviceState" class="value">-</p>
          <small id="serviceName">NusaTunnelClient</small>
        </article>
        <article class="tile tile-wide">
          <span class="label">IP Publik Server</span>
          <p id="serverPublicIP" class="value">-</p>
          <small id="serverHost">Host: -</small>
        </article>
        <article class="tile tile-wide">
          <span class="label">Status Server</span>
          <p id="dashboardStatus" class="value">Dashboard: -</p>
          <small id="controlStatus">Control Port: -</small>
        </article>
        <article class="tile tile-wide">
          <span class="label">Performa Database (Pengoptimal)</span>
          <p id="postgresStatus" class="value">Status: -</p>
          <small id="postgresLatency">Connect: - ms | Query: - ms | Tx: - ms</small>
          <small id="postgresChecked">Diperiksa: -</small>
        </article>
      </section>

      <section class="panel compact">
        <h2>Kontrol Layanan</h2>
        <div class="actions-grid">
          <button id="btnStart">Mulai</button>
          <button id="btnStop">Hentikan</button>
          <button id="btnRestart">Mulai Ulang</button>
          <button id="btnRefresh">Perbarui</button>
        </div>
      </section>

      <section class="panel compact">
        <h2>Pengaturan</h2>
        <label for="configPath">Lokasi File Pengaturan (client.toml)</label>
        <div class="row tight">
          <input id="configPath" type="text" />
          <button id="btnSaveConfig">Simpan</button>
        </div>
        <div class="row tight">
          <button id="btnEnableAutostart">Aktifkan Auto-Start</button>
          <button id="btnDisableAutostart">Matikan Auto-Start</button>
        </div>
      </section>

      <section class="panel compact">
        <h2>Pesan</h2>
        <p id="message" class="message">Siap.</p>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
